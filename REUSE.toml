# SPDX-FileCopyrightText: 2026 Inceptless <support@inceptless.com>
# SPDX-License-Identifier: CC-BY-4.0
#
# REUSE annotations for files that cannot carry comments themselves.
# Inline SPDX headers in a file take precedence over these fallbacks; this file
# exists so that JSON, binary test material and copied legal text also carry
# licensing information. See LICENSING.md for the licensing split.
version = 1

# Machine-readable data and executable material: code, schemas and vectors.
[[annotations]]
path = [
    ".gitignore",
    "schemas/**",
    "vectors/**",
    "verifiers/python/**",
    "tools/**",
    ".github/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "Apache-2.0"

# Prose written in Markdown is documentation, licensed CC-BY-4.0. Files that
# carry their own SPDX header are not affected by this fallback.
[[annotations]]
path = ["**/*.md", "docs/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# CLA.md is copied byte-for-byte from the Inceptless CLA source, so it cannot
# carry an inline header. It is legal prose and is declared CC-BY-4.0. The
# annotation is "override" because the agreement's section headings (for example
# "## 2. Copyright licence") would otherwise be parsed as a copyright notice.
[[annotations]]
path = "CLA.md"
precedence = "override"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "CC-BY-4.0"

# Brand assets in assets/ are reserved under LicenseRef-Inceptless-Brand and are
# deliberately outside the code and documentation licenses above. The custom
# reference text lives in LICENSES/LicenseRef-Inceptless-Brand.txt.
[[annotations]]
path = ["assets/**", "LICENSES/LicenseRef-Inceptless-Brand.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "LicenseRef-Inceptless-Brand"

# External test data keeps the license recorded by its upstream source (each
# directory carries SOURCE.json and PROVENANCE.md). Upstream bytes follow the
# entry below.
[[annotations]]
path = ["vectors/external/rfc8785-jcs/**", "vectors/external/wycheproof/**"]
precedence = "closest"
SPDX-FileCopyrightText = "The upstream authors of the referenced test data"
SPDX-License-Identifier = "Apache-2.0"

# Provenance and expectation metadata written by this repository inside the
# external-data directories: it is ours, not the upstream authors'.
[[annotations]]
path = [
    "vectors/external/rfc8785-jcs/SOURCE.json",
    "vectors/external/rfc8785-jcs/SHA256SUMS",
    "vectors/external/wycheproof/SOURCE.json",
    "vectors/external/wycheproof/SHA256SUMS",
    "vectors/external/wycheproof/EXPECTED_OUTCOMES.json",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "Apache-2.0"

# RFC 8032 is an IETF document: its text is redistributed unmodified under the
# IETF Trust Legal Provisions (BCP 78), not under the repository licenses.
# SOURCE.json and SHA256SUMS are our provenance metadata, so they stay
# Apache-2.0 like the rest of the vector tooling; "override" is used because
# SOURCE.json's license string contains the words "Copyright Notice", which
# file-content scanning would otherwise take for a copyright statement.
[[annotations]]
path = "vectors/external/rfc8032/**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["vectors/external/rfc8032/SOURCE.json", "vectors/external/rfc8032/SHA256SUMS"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Inceptless <support@inceptless.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "vectors/external/rfc8032/rfc8032.txt"
precedence = "override"
SPDX-FileCopyrightText = "IETF Trust and the persons identified as the document authors"
SPDX-License-Identifier = "LicenseRef-IETF-Trust"

# The license texts themselves. REUSE treats LICENSE and LICENSES/ as licensing
# information rather than as content to be licensed, so these entries are a
# provenance note for readers; they do not relicense the stewards' words.
[[annotations]]
path = ["LICENSE", "LICENSES/Apache-2.0.txt"]
precedence = "closest"
SPDX-FileCopyrightText = "Apache Software Foundation"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "LICENSES/CC-BY-4.0.txt"
precedence = "closest"
SPDX-FileCopyrightText = "Creative Commons Corporation"
SPDX-License-Identifier = "CC-BY-4.0"
