#
# H0 revision-2 gates: specification, vectors, verifier and repository checks.
# The repository is public and this workflow is defined here; this file does not
# claim that a particular GitHub Actions run passed, and every command below also
# runs locally from the repository root (see CONTRIBUTING.md). Dependency
# versions are pinned by verifiers/python/constraints.txt; Python 3.12 is
# covered by this workflow when it runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: H0 gates (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reference verifier and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c verifiers/python/constraints.txt -e "verifiers/python[dev]"
          python -m pip install reuse==5.0.2

      - name: Generator determinism
        run: |
          python tools/make_keys.py --check
          python tools/gen_vectors.py --check
          python tools/gen_vectors_extra.py --check
          python tools/gen_index.py --check

      - name: Python tests
        run: python -m pytest verifiers/python/tests -q

      - name: Conformance vectors
        run: hyphaweave-verify vectors vectors

      - name: Frozen candidate SHA-256 manifest
        working-directory: vectors/frozen/v0.1-candidate
        run: sha256sum -c --strict SHA256SUMS

      - name: Frozen candidate file set and case count
        run: python tools/check_frozen.py

      - name: Frozen candidate vectors
        run: hyphaweave-verify vectors vectors/frozen/v0.1-candidate

      - name: Schema self-check
        run: python tools/check_schemas.py

      - name: External data cross-check
        run: python tools/check_external.py

      - name: True source ablation
        run: python tools/anti_verification.py

      - name: Byte-flip gate (every byte of every positive vector)
        run: python tools/byte_flip_gate.py

      - name: Specification examples
        run: python tools/check_spec_examples.py

      - name: REUSE lint
        run: reuse lint

  rust:
    name: H1 Rust verifier (stable toolchain)
    runs-on: ubuntu-latest
    # CI uses the default CARGO_HOME and target directory. The .tmp-work/cargo-home
    # setting described in verifiers/rust/ARCHITECTURE.md is a local sandbox
    # workaround only and must not be used here.
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust formatting
        run: cargo fmt --manifest-path verifiers/rust/Cargo.toml --check

      - name: Rust lints (clippy, warnings are errors)
        run: cargo clippy --manifest-path verifiers/rust/Cargo.toml --all-targets -- -D warnings

      - name: Rust unit and integration tests
        run: cargo test --manifest-path verifiers/rust/Cargo.toml --workspace

      - name: Rust verifier over the conformance vectors
        run: |
          cargo run --manifest-path verifiers/rust/Cargo.toml -p hyphaweave-verify-rs -- vectors vectors
          cargo run --manifest-path verifiers/rust/Cargo.toml -p hyphaweave-verify-rs -- vectors vectors/frozen/v0.1-candidate

      - name: Install supply-chain tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit

      - name: Licence, bans, sources and advisory policy
        working-directory: verifiers/rust
        run: cargo deny check

      - name: RustSec advisory audit
        working-directory: verifiers/rust
        # The two ignored advisories are timing-side-channel issues in secret-key
        # operations; this verifier only performs public-key signature verification
        # and handles no secret key material. The same reasons are recorded in
        # verifiers/rust/deny.toml and verifiers/rust/README.md.
        run: cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0387

      - name: Set up Python for the reference verifier (gate 3 black box)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reference verifier (used as a black box only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c verifiers/python/constraints.txt -e "verifiers/python[dev]"

      - name: Two-implementation report comparison (gate 3)
        # Runs only after the Rust verifier passed the vector steps above; the
        # script re-checks that precondition and compares every case's report
        # bytes after normalizing the §14.6 verifier identity object.
        run: python verifiers/rust/scripts/compare_reports.py --include-frozen
