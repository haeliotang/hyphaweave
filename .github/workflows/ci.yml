#
# H0 gates: specification/vectors/verifier checks. The repository is not pushed
# yet, so this workflow has not run on GitHub; every command below also runs
# locally from the repository root (see CONTRIBUTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: H0 gates (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install reference verifier and tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "verifiers/python[dev]"
          python -m pip install reuse==5.0.2

      - name: Python tests
        run: python -m pytest verifiers/python/tests -q

      - name: Conformance vectors
        run: hyphaweave-verify vectors vectors

      - name: Frozen v0.1 vectors
        run: hyphaweave-verify vectors vectors/frozen/v0.1

      - name: Schema self-check
        run: python tools/check_schemas.py

      - name: External data cross-check
        run: python tools/check_external.py

      - name: Anti-verification
        run: python tools/anti_verification.py

      - name: REUSE lint
        run: reuse lint
