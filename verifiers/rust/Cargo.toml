#
# Workspace for the H1 Rust verifier of weave-record/1. The library crate
# `hyphaweave-verify` is the embeddable verifier; `hyphaweave-verify-rs` is the
# command-line front end. See README.md.

[workspace]
resolver = "2"
members = ["hyphaweave-verify", "hyphaweave-verify-rs"]

[workspace.package]
edition = "2021"
rust-version = "1.87"
license = "Apache-2.0"

[workspace.dependencies]
sha2 = "0.10.9"
curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables"] }
miniz_oxide = "0.8.9"
rsa = { version = "0.10.0", default-features = false, features = ["encoding", "pkcs1v15"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
p384 = { version = "0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
signature = "3"

# Dependencies (bignum RSA, curve arithmetic, SHA-2) are compiled with
# optimisations even in the dev profile. Unoptimised, the RSA and ECDSA
# vectors make the debug verifier take over ten minutes per vector set on
# the CI runner, which exceeds gate 3's per-process timeout. Only the
# third-party crates are affected: this workspace's own crates keep the
# default dev settings (opt-level 0, debug assertions and overflow checks),
# so the small-stack test still measures unoptimised verifier frames.
[profile.dev.package."*"]
opt-level = 2
