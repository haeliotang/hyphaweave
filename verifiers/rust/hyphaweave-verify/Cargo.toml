#
# `hyphaweave-verify`: library crate implementing the weave-record/1 verifier.

[package]
name = "hyphaweave-verify"
version = "0.1.0"
description = "weave-record/1 verifier (H1, independent implementation)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sha2.workspace = true
curve25519-dalek.workspace = true
miniz_oxide.workspace = true
rsa.workspace = true
p256.workspace = true
p384.workspace = true
signature.workspace = true

[features]
# The §14.7 test-only check-skip hook (R3). Off by default: a default build
# has no `VerifyOptions::skip_checks` field. The CLI enables it and still reads
# the hook only behind the explicit `--test-hooks` switch.
test-hooks = []

[dev-dependencies]
# Tests exercise the §14.7 hook (ablation probes, R4).
hyphaweave-verify = { path = ".", features = ["test-hooks"] }
